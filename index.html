<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="./css/modern-normalize.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="main-container">

        <div class="grid-container" id="ticTacBoard">
            <div class="grid-item" data-position="top-left" data-mark="">1</div>
            <div class="grid-item" data-position="top-center" data-mark="">2</div>
            <div class="grid-item" data-position="top-right" data-mark="">3</div>
            <div class="grid-item" data-position="center-left" data-mark="">4</div>
            <div class="grid-item" data-position="center-center" data-mark="">5</div>
            <div class="grid-item" data-position="center-right" data-mark="">6</div>
            <div class="grid-item" data-position="bottom-left" data-mark="">7</div>
            <div class="grid-item" data-position="bottom-center" data-mark="">8</div>
            <div class="grid-item" data-position="bottom-right" data-mark="">9</div>
        </div>

        <div class="flex-container">
            <h1>Project TicTacToe</h1>

            <div class="player" id="player1">
                <div class="player-item player-name" data-name="">Player1</div>
                <div class="player-item player-score" data-score="">0</div>
            </div>

            <div class="player" id="player2">
                <div class="player-item player-name" data-name="">Player2</div>
                <div class="player-item player-score" data-score="">0</div>
            </div>

            <div class="flex-container buttons">
                <button class="btn" command="show-modal" commandfor="playerSetup">Setup</button>
                <button class="btn">Play</button>
            </div>
        </div>
    </div>

    <dialog id="playerSetup">

        <h2>Player Setup</h2>
        <form action="">
            <p>
                <label for="player-name">Player Name:</label>
                <input type="text" id="player-name">
            </p>

            <button type="submit" class="btn" id="name-btn">Enter Name</button>
        </form>
        
        <button class="btn dialog-close" command="close" commandfor="playerSetup">X</button>
    </dialog>

    <script src="js/script.js"></script>
</body>

</html>
